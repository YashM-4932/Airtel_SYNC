[pytest]
testpaths = tests
markers =
    ocr: runs the real OCR engine on the specimen documents (slower)
filterwarnings =
    ignore::DeprecationWarning:fastapi.*
    ignore::DeprecationWarning:starlette.*
    # Pillow warns (not raises) for 25-50 MP images; the app refuses them itself, and the F-24 tests open such images on purpose
    ignore::PIL.Image.DecompressionBombWarning
